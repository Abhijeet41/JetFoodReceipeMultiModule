name: Run test

on:
  pull_request:
    branches: [setp2_integrate_recepie_module]
jobs:
  build:
    runs-on: ubuntu-latest

  steps:
    - uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'focal'
        cache: 'gradle'

    - name: Grant exectute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Test
      run: ./gradlew :receipe:test

    - name: Run gradle build
      run: ./gradlew :receipe:build






