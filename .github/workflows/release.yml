name: Deploy to google play

on:
  push:
    branch: [gihub-cicd-flow]

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps: # ← moved inside 'build'
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin' # ← also fixed: 'focal' is invalid here
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      #      - name: Run Unit Test
      #        run: ./gradlew :receipe:data:testDebugUnitTest

      - name: Run Unit Test
        run: ./gradlew clean testDebug

      - name: Run gradle build
        run: ./gradlew :receipe:build


  distribute:
    name: Deploy Bundle to Google Play Store
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin' # ← also fixed: 'focal' is invalid here
          cache: 'gradle'

      - name: Version bump
        uses: chkfung/android-version-action@v1.2.3
        with:
          gradlePath: app/build.gradle.kts
          versionCode: ${{ github.run_number }}

      - name: Assemble Release Bundle
        run: ./gradlew bundleRelease

      - name: Sign Release
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          alias: ${{ secrets.ANDROID_DEVS_ALIAS }}
          keyPassword: ${{ secrets.ANDROID_DEVS_ALIAS_PASSWORD }}

